name: Platform Operator Continuity

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify active platform operator
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install verification dependencies
        run: |
          npm ci
          npx prisma generate

      # Read-only check. A failure leaves infrastructure and tenant data
      # untouched, while creating an auditable GitHub Actions incident signal.
      - name: Verify active platform operator continuity
        run: npm run ops:verify-platform-operator
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
